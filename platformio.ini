[platformio]
default_envs = gateway_s3

; Every platform is pinned explicitly. Two platforms are installed side by side
; and both claim the name "espressif32", so a bare `platform = espressif32`
; silently resolves to whichever is newer and swaps the whole toolchain.
;   - Gateway Arduino/S3 -> official platform 7.1.2 (Arduino core 2.0.17)
;   - ESP-IDF/Zigbee -> pioarduino (ESP-IDF 5.5.5, ESP32-H2 support)
;   - Waveshare HMI -> pioarduino Arduino 3.x in C:\pio-display
[pioarduino]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board_build.partitions = partitions_zigbee.csv

[env:gateway_s3]
platform = espressif32@7.1.2
board = 4d_systems_esp32s3_gen4_r8n16
framework = arduino
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.partitions = partitions_16mb_3mb_ota_spiffs.csv
build_src_filter =
    +<gateway/>
    +<common/>
    -<hub/>
    -<sensor/>
build_flags =
    -D CONFIG_BOOTLOADER_APP_ROLLBACK_ENABLE=1
    -I src/gateway
    -I src/common
lib_deps =
    knolleary/PubSubClient
    bblanchon/ArduinoJson
monitor_speed = 115200

[env:zigbee_hub_c6]
extends = pioarduino
board = esp32-c6-devkitc-1
; The board definition is 8 MB. This hub module is 4 MB.
board_upload.flash_size = 4MB
board_build.flash_size = 4MB
board_upload.maximum_size = 4194304
framework = espidf
; This platform reads only the root sdkconfig.defaults, so point IDF at the per-env file.
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.defaults.hub_c6 -DSHUNYA_ZB_ROLE=hub
build_src_filter =
    +<hub/>
    +<common/>
    -<gateway/>
    -<sensor/>
    -<thread_common/>
build_flags =
    -I src/hub
    -I src/common
monitor_speed = 115200

[env:zigbee_sensor_c6]
extends = pioarduino
; ESP32-C6-MINI-1 module. DevKitM-1 is the matching 4 MB board definition.
board = esp32-c6-devkitm-1
; ESP32-C6-MINI-1 has 4 MB flash. Pin the image header to that size.
board_upload.flash_size = 4MB
board_build.flash_size = 4MB
board_upload.maximum_size = 4194304
framework = espidf
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.defaults.sensor_c6 -DSHUNYA_ZB_ROLE=sensor
build_src_filter =
    +<sensor/>
    +<common/shunya_zb.h>
    -<hub/>
    -<gateway/>
    -<thread_common/>
build_flags =
    -I src/sensor
    -I src/common
monitor_speed = 115200

[env:zigbee_sensor_h2_demo]
extends = pioarduino
board = esp32-h2-devkitm-1
framework = espidf
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.defaults.sensor_h2_demo -DSHUNYA_ZB_ROLE=sensor
build_src_filter =
    +<sensor/>
    +<common/shunya_zb.h>
    -<hub/>
    -<gateway/>
    -<thread_common/>
build_flags =
    -I src/sensor
    -I src/common
    -D SENSOR_DEMO_SERIAL=1
monitor_speed = 115200

[env:display_s3]
; Waveshare ESP32-S3-Touch-LCD-7 (N16R8, ST7262 RGB + GT911 touch).
; Use scripts/display-build.ps1 so Arduino 3.x packages remain isolated.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
build_src_filter =
    +<display/>
    +<common/>
    -<gateway/>
    -<hub/>
    -<sensor/>
build_flags =
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D LV_CONF_INCLUDE_SIMPLE
    -D ESP_PANEL_BOARD_DEFAULT_USE_SUPPORTED=1
    -D BOARD_WAVESHARE_ESP32_S3_TOUCH_LCD_7=1
    -I src/display
    -I src/display/board
    -I src/display/ui
    -I src/common
lib_deps =
    lvgl/lvgl@8.4.0
    https://github.com/esp-arduino-libs/ESP32_Display_Panel.git#v1.0.4
    https://github.com/esp-arduino-libs/ESP32_IO_Expander.git#v1.1.1
    https://github.com/esp-arduino-libs/esp-lib-utils.git#v0.2.3
monitor_speed = 115200
